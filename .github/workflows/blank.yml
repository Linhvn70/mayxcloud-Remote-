name: Build Custom Moonlight APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p source_code
          unzip -q source.zip -d source_code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 25.1.8937393

      - name: Build APK with Gradle
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Không tìm thấy file gradlew!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Thư mục dự án: $PROJECT_DIR"
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-moonlight-apk
          path: '**/build/outputs/apk/debug/*.apk'
