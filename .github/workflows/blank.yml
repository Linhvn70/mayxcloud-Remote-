name: Build Custom Moonlight APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p source_code
          unzip -q source.zip -d source_code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Setup Legacy NDK r21e
        run: |
          echo "Đang tải NDK r21e..."
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r21e" >> $GITHUB_ENV

      - name: Fix NDK Version Conflict in Project
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          # Trỏ local.properties về đúng NDK r21e
          echo "ndk.dir=$PWD/android-ndk-r21e" > "$PROJECT_DIR/local.properties"
          
          # Xóa bỏ dòng cấu hình ndkVersion bị cứng nhắc trong mã nguồn để tránh xung đột phiên bản
          find source_code -name "build.gradle" -exec sed -i '/ndkVersion/d' {} +
          find source_code -name "build.gradle.kts" -exec sed -i '/ndkVersion/d' {} +
          echo "Đã gỡ bỏ ràng buộc ndkVersion trong source code!"

      - name: Build APK with Gradle
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-moonlight-apk
          path: '**/build/outputs/apk/debug/*.apk'
