name: Build Custom Moonlight APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p source_code
          unzip -q source.zip -d source_code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Setup Legacy NDK r21e
        run: |
          echo "Đang tải NDK r21e..."
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r21e" >> $GITHUB_ENV

      - name: Force Strip ndkVersion via Python
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          # Trỏ local.properties về NDK r21e
          echo "ndk.dir=$PWD/android-ndk-r21e" > "$PROJECT_DIR/local.properties"
          
          # Dùng Python quét và xóa sạch mọi dòng chứa ndkVersion trong các file gradle
          python3 -c '
          import glob
          for filepath in glob.glob("source_code/**/build.gradle*", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              lines = content.splitlines()
              new_lines = [l for l in lines if "ndkVersion" not in l]
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write("\n".join(new_lines) + "\n")
          print("Đã xóa sạch ndkVersion cứng trong mã nguồn!")
          '

      - name: Build APK with Gradle
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-moonlight-apk
          path: '**/build/outputs/apk/debug/*.apk'
