name: Build Custom Moonlight APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p source_code
          unzip -q source.zip -d source_code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and Accept Licenses
        run: |
          echo "Đang cài đặt NDK 25.1.8937393 trực tiếp qua sdkmanager..."
          echo "y" | sdkmanager --install "ndk;25.1.8937393"
          
          # Tự động tìm thư mục dự án và trỏ local.properties vào đúng NDK vừa cài
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          SDK_PATH=$ANDROID_SDK_ROOT
          NDK_PATH="$SDK_PATH/ndk/25.1.8937393"
          
          echo "ndk.dir=$NDK_PATH" > "$PROJECT_DIR/local.properties"
          echo "Đã cấu hình ndk.dir trỏ tới: $NDK_PATH"

      - name: Build APK with Gradle
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-moonlight-apk
          path: '**/build/outputs/apk/debug/*.apk'
