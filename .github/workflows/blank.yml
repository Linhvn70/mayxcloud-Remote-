name: Build Moonlight APK via Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: mingc/android-build-box:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p source_code
          unzip -q source.zip -d source_code

      - name: Find and Build with Gradle
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Không tìm thấy file gradlew!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Thư mục dự án: $PROJECT_DIR"
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          
          # Tiến hành build trực tiếp trong môi trường sạch
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
