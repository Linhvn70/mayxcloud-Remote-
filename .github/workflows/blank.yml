name: Build Android APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p source_code
          unzip -q source.zip -d source_code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch Application.mk for NDK Compatibility
        run: |
          # Xóa bỏ dòng APP_PLATFORM cũ (android-16) gây xung đột với NDK 23
          find source_code -name "Application.mk" -exec sed -i '/APP_PLATFORM/d' {} +
          echo "Đã vá xong file Application.mk!"

      - name: Find and Build with Gradle
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Không tìm thấy file gradlew trong source code!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Đã tìm thấy dự án tại: $PROJECT_DIR"
          
          chmod +x "$GRADLEW_PATH"
          
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
