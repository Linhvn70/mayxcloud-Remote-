name: Build Custom Moonlight APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p source_code
          unzip -q source.zip -d source_code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK 23
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 23.2.8568313

      - name: Patch Application.mk for NDK 23
        run: |
          # Tìm tất cả file Application.mk để sửa cấu hình tương thích NDK 23
          find source_code -name "Application.mk" -exec bash -c '
            for file; do
              # Bổ sung cờ bỏ qua kiểm tra lỗi ABI cũ
              echo "APP_ALLOW_MISSING_DEPS := true" >> "$file"
              sed -i "/APP_PLATFORM/d" "$file"
              sed -i "s/gnustl_static/c++_static/g" "$file"
              sed -i "s/stlport_static/c++_static/g" "$file"
            done
          ' _ {} +
          echo "Đã vá xong toàn bộ file Application.mk!"

      - name: Find and Build with Gradle
        run: |
          GRADLEW_PATH=$(find source_code -name "gradlew" -type f)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Không tìm thấy file gradlew trong source code!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Đã tìm thấy dự án tại: $PROJECT_DIR"
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          
          # Truyền cờ ép Gradle chấp nhận NDK 23 và tiếp tục build
          ./gradlew assembleDebug -Pandroid.ndkVersion=23.2.8568313 -Pandroid.options.noStubs=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-moonlight-apk
          path: '**/build/outputs/apk/debug/*.apk'
